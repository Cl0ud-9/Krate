# blank issues stay on: Krate's own "Feedback & bug reports" and "Suggest an app" open a pre-filled blank issue
blank_issues_enabled: true
contact_links:
  - name: Report a security problem
    url: https://github.com/Cl0ud-9/Krate/security/advisories/new
    about: Please report security problems privately, not as a public issue.
  - name: A problem with an app Krate installs
    url: https://github.com/Cl0ud-9/Krate/blob/main/CONTRIBUTING.md#before-you-start
    about: Problems inside an app (not with installing it) are best reported to that app's own developers.
